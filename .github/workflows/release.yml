# Native packages: AppImage, .deb, .rpm and an Arch package, built on every
# push and pull request that could break them and attached to the GitHub
# release on every tag.
#
# Why this exists at all, in one sentence: seven releases and zero downloadable
# assets, because the only install route Cordial had was
# `flatpak remote-add` against an unsigned custom remote. mocktail, a
# comparable project started ten days later, ships five kinds of artefact on
# its releases and gets used because of it. Flatpak already has its own
# workflow -- .github/workflows/flatpak.yml, which additionally publishes an
# OSTree remote to GitHub Pages -- and this file is deliberately separate from
# it rather than a fifth job bolted on: that workflow's concurrency group
# exists because two runs cannot safely publish to the same Pages deployment
# at once, and nothing here shares that resource, so entangling the two would
# only add a reason for four independent jobs to queue behind one unrelated
# one.
#
# None of the four jobs below fetch, embed or reference any Roblox material.
# Every one of them builds Cordial's own source (plus the same third-party OSS
# Cordial always depends on -- libbadcpu, mcpelauncher-linker, libjnivm,
# mocktail-webview) and nothing else; the resulting packages start, find no
# Roblox build, and say so, exactly like every other packaging format already
# does. See AGENTS.md, "Permanently out of scope".
#
# Each job builds in a container image of the distribution family its output
# targets -- Fedora for .rpm and the AppImage (Fedora 44 specifically, because
# test.yml already established it as the one environment this workspace
# proves builds gtk4 4.22/libadwaita 1.9 correctly; Fedora 43 and Ubuntu 24.04
# are both older and fail three *-sys build scripts with a pkg-config hint
# that reads as a missing package rather than an old one), Ubuntu for .deb,
# archlinux:base-devel for the Arch package -- rather than cross-building on
# one host, which is how mocktail's own packages.yml is shaped too (docker
# run against a target image per format), and matches this project's own
# reasoning in packaging/build-flatpak.sh for why a Flatpak is worth building
# on every change: it is the only check that a runtime's dependencies are
# declared rather than merely present on the machine that happens to be
# building it.
#
# Every job's own dependency list is read from one place rather than copied
# into this file and left to drift the way packaging/cargo-sources.json can
# drift from Cargo.lock: the .rpm job runs `dnf builddep` against the SRPM
# it just built, and the Arch job sources its own PKGBUILD and reads
# depends()/makedepends() out of it. The .deb job is the one exception,
# because there is no equivalent single source of truth for a hand-built
# .deb -- see packaging/deb/control.in's own comment on why that list is
# translated by hand from the same soname list the other three formats
# already carry.

name: Native packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'native/**'
      - 'third_party/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packaging/appimage/**'
      - 'packaging/deb/**'
      - 'packaging/rpm/**'
      - 'packaging/aur/cordial/**'
      - 'packaging/version.sh'
      - 'packaging/icons/**'
      - 'packaging/io.github.luohoa97.Cordial.desktop'
      - 'packaging/io.github.luohoa97.Cordial.metainfo.xml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'native/**'
      - 'third_party/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packaging/appimage/**'
      - 'packaging/deb/**'
      - 'packaging/rpm/**'
      - 'packaging/aur/cordial/**'
      - 'packaging/version.sh'
      - 'packaging/icons/**'
      - 'packaging/io.github.luohoa97.Cordial.desktop'
      - 'packaging/io.github.luohoa97.Cordial.metainfo.xml'
      - '.github/workflows/release.yml'
  # **The way to start a release build by hand, and it is needed.** `paths`
  # above applies to tag pushes as well as branch pushes, and a tag pointing at
  # a commit already on main pushes no new commits -- so nothing matches the
  # filter and no run happens at all. That is what left v0.11.0 tagged twice
  # with no build and no release page.
  workflow_dispatch:

# `contents: write` only where a job actually uploads to a release -- see
# flatpak.yml, which gives the same reasoning: read is enough for everything
# else, and a release with nothing attached to it is the whole reason this
# file exists, so the step that attaches something is the one that needs the
# broader grant.
# **`write`, and it has to be, however much read would suit the rest.** Each of
# the four jobs ends with a `gh release upload` that runs only on a tag, and
# with `contents: read` that step gets a 403 -- which is why v0.8.0 and v0.9.0
# both published with a Flatpak bundle and no native packages while every push
# to main went green. On main the attach step is skipped, so the missing grant
# is invisible; on a tag it is the only step that matters.
#
# A comment elsewhere in this file used to claim the grant was made per-job
# "only where a job actually uploads". It never was. Narrowing it again means
# a `permissions:` block inside each of the four jobs, and is worth doing the
# day somebody adds a job that should not be able to write.
permissions:
  contents: write

# Per-ref rather than the single global group flatpak.yml uses: these four
# jobs do not share a publish target the way a Pages deployment does, so
# there is no reason to serialise a tag build behind an unrelated main-branch
# build. A second push to the *same* ref supersedes the first, which is the
# ordinary case of someone pushing twice in a hurry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: AppImage (Fedora 44)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    # Generous rather than measured: nobody has timed a green run of this job,
    # because authoring it did not include running it (this worktree was
    # asked not to build, to avoid confounding a frame-rate measurement
    # running on the same machine). test.yml's own cargo test --workspace
    # runs in well under this on the same toolchain; linuxdeploy's dependency
    # walk and appimagetool's squashing add to that, not replace it.
    timeout-minutes: 75
    steps:
      - name: Install build and packaging tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git rust cargo clang cmake gcc-c++ binutils llvm lld \
            pkgconf-pkg-config openssl-devel \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel \
            pipewire-devel pulseaudio-libs-devel alsa-lib-devel \
            wayland-devel vulkan-loader-devel libxkbcommon-devel \
            librsvg2-tools glib2 curl \
            patchelf fuse-libs \
            squashfs-tools desktop-file-utils file zsync
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: git safe.directory
        # rpmbuild's own container jobs need this too (see the rpm job below)
        # for the same reason: the container runs as root over a workspace
        # actions/checkout left owned by the runner's UID, and git 2.35.2+
        # (CVE-2022-24765) refuses to operate across that boundary.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: actions/cache for the crate registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: appimage-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: appimage-cargo-
      - name: Build the AppImage
        run: packaging/appimage/build-appimage.sh --outdir dist/appimage
      - name: Refuse a tag that disagrees with Cargo.toml
        # **The one thing that actually bites when the manifest is the version.**
        # `Cargo.toml` is now the only source of the version -- see
        # crates/cordial-shell/src/version.rs -- so a `v0.11.0` tag cut against a
        # tree whose manifest still says 0.10.0 produces a release whose binaries
        # announce the wrong number, and nothing else would notice. Package
        # filenames come from the tag and the binary comes from the manifest, so
        # the two must not drift.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match Cargo.toml $manifest" >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml"
      - name: Refuse a binary that needs a newer glibc than the floor
        # One `log10f@GLIBC_2.43`, from a single `std::log10` on a float, made
        # v0.10.0's .rpm uninstallable anywhere older than Fedora 44 and would
        # have made the AppImage -- which bundles no libc -- run on nothing
        # else. It was invisible because every builder and every developer
        # machine is newer than every user. A container's glibc moving forward
        # changes no line in this repository, so it needs a check rather than a
        # habit.
        run: ./packaging/check-glibc-floor.sh target/release/cordial-run target/release/cordial-shell
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: cordial-appimage
          path: dist/appimage/*.AppImage
          if-no-files-found: error

  deb:
    # **Not the LTS, and it cannot be.** `crates/cordial-shell/Cargo.toml` takes
    # gtk4 with the `v4_20` feature, so `gdk4-sys` asks pkg-config for
    # `gtk4 >= 4.20`. Ubuntu 24.04 LTS ships 4.14.5 and the job failed on
    # exactly that: "Package 'gtk4' has version '4.14.5', required version is
    # '>= 4.20'". That is the dependency floor excluding the distribution, not a
    # container misconfigured -- lowering the floor to reach an LTS is the wrong
    # direction and would give up the libadwaita the shell is built on.
    #
    # So this targets a release new enough to satisfy it, and Debian-family
    # users on anything older are served by the Flatpak and the AppImage, both
    # of which carry their own GTK. That is the argument for the AppImage being
    # the important artifact here rather than a convenience.
    #
    # 25.10 is chosen because it is the first Ubuntu that plausibly carries
    # 4.20, and it is UNVERIFIED until this job goes green -- which is a cheap
    # way to find out and an honest place to say so.
    name: .deb (Ubuntu 25.10)
    runs-on: ubuntu-latest
    container: ubuntu:25.10
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        # The same package names README.md §3 already documents for building
        # Cordial on Debian/Ubuntu from source, plus the audio backends'
        # headers and the packaging tools this job needs on top of that.
        # rustup rather than apt's own rustc/cargo: Ubuntu's packaged Rust
        # trails upstream stable and this workspace pins rust-version = 1.75
        # in Cargo.toml.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential clang cmake pkg-config \
            binutils libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev zlib1g-dev \
            desktop-file-utils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: actions/cache for the crate registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: deb-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: deb-cargo-
      - name: Validate the desktop file
        # appstream-util's package name is not verified for Ubuntu 24.04 --
        # unlike desktop-file-validate, which README.md and the other three
        # formats' own %check/check() steps already exercise -- so this runs
        # the one validation this job is confident is installed, rather than
        # guess a package name and risk failing the whole job on tooling that
        # was never the point.
        run: desktop-file-validate packaging/io.github.luohoa97.Cordial.desktop
      - name: Build the .deb
        run: packaging/deb/build-deb.sh --outdir dist/deb
      - name: Refuse a binary that needs a newer glibc than the floor
        # One `log10f@GLIBC_2.43`, from a single `std::log10` on a float, made
        # v0.10.0's .rpm uninstallable anywhere older than Fedora 44 and would
        # have made the AppImage -- which bundles no libc -- run on nothing
        # else. It was invisible because every builder and every developer
        # machine is newer than every user. A container's glibc moving forward
        # changes no line in this repository, so it needs a check rather than a
        # habit.
        run: ./packaging/check-glibc-floor.sh target/release/cordial-run target/release/cordial-shell
      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: cordial-deb
          path: dist/deb/*.deb
          if-no-files-found: error

  rpm:
    name: .rpm (Fedora 44)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    # %check runs the workspace's test suite once inside this job (with the
    # same three session-bus-dependent skips packaging/rpm/cordial.spec
    # documents), on top of %build's own compile -- more than the deb and
    # arch jobs, close to what the arch job's check() also repeats.
    timeout-minutes: 75
    steps:
      - name: Install the tools make-srpm.sh itself needs
        # Not the project's own build dependencies -- those are declared once,
        # in packaging/rpm/cordial.spec's BuildRequires, and installed below
        # via `dnf builddep` against the SRPM once it exists. This step only
        # has to get as far as running make-srpm.sh, which needs git, cargo
        # (for `cargo vendor`), rpmbuild and zstd -- see that script's header.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cargo rust rpm-build rpmdevtools zstd
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: actions/cache for the crate registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rpm-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: rpm-cargo-
      - name: Build the binary RPM
        run: packaging/rpm/build-rpm.sh --outdir dist/rpm
      - name: Upload the RPM
        uses: actions/upload-artifact@v4
        with:
          name: cordial-rpm
          path: dist/rpm/**/*.rpm
          if-no-files-found: error

  arch:
    name: Arch package (archlinux:base-devel)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Install the PKGBUILD's own depends() and makedepends()
        # Read out of packaging/aur/cordial/PKGBUILD by sourcing it rather
        # than copied into this file, for the same reason the .rpm job uses
        # `dnf builddep` instead of a hand-written package list: one place to
        # keep in step rather than two that can silently drift apart. Sourcing
        # a PKGBUILD to read its arrays is the ordinary way to do this without
        # a full makepkg run; it does execute the file's top-level code, which
        # is accepted here because this is Cordial's own first-party file, not
        # one fetched from elsewhere.
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(
            bash -c 'source packaging/aur/cordial/PKGBUILD; printf "%s\n" "${depends[@]}" "${makedepends[@]}"' \
              | sed -E 's/[<>=].*$//'
          )
          pacman -Syu --needed --noconfirm git "${pkgs[@]}"
      - name: Build the package as a non-root user
        # makepkg refuses to run as root, and the container is root by
        # default -- the same requirement mocktail's own packages.yml states
        # and works around the same way.
        env:
          # CI always builds the tag actually being released, or, off a tag,
          # HEAD of main -- see packaging/aur/cordial/PKGBUILD's own comment
          # on why this variable exists: the committed PKGBUILD's pkgver is
          # bumped by hand at each release the way PUBLISHING.md already
          # documents for .SRCINFO, and CI should not depend on that having
          # happened yet.
          CORDIAL_PKGBUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
        run: |
          set -euo pipefail
          useradd --create-home builder
          # $GITHUB_WORKSPACE rather than a guessed container path: that is
          # the one name Actions guarantees points at the checkout, whatever
          # the container job happens to mount it at.
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env CORDIAL_PKGBUILD_TAG="$CORDIAL_PKGBUILD_TAG" \
            makepkg --dir "$GITHUB_WORKSPACE/packaging/aur/cordial" \
              --noconfirm --cleanbuild --force
          install -d dist/arch
          cp packaging/aur/cordial/*.pkg.tar.zst dist/arch/
          pacman -Qp dist/arch/*.pkg.tar.zst >/dev/null
      - name: Upload the Arch package
        uses: actions/upload-artifact@v4
        with:
          name: cordial-arch
          path: |
            dist/arch/*.pkg.tar.zst
            packaging/aur/cordial/PKGBUILD
          if-no-files-found: error

  publish:
    name: Attach to the release
    # The create-if-missing / upload / sign logic used to live here entirely.
    # It now lives in attach-to-release.yml (`on: workflow_call`), because
    # flatpak.yml grew its own copy of half of it and let the two drift: no
    # create-if-missing there and nothing signed, so a tag where the Flatpak
    # build finished first failed the way this job used to fail before it
    # grew the create-if-missing check, and the Flatpak bundle was the one
    # artefact nobody ever signed. See that file's header for why the job
    # runs on the bare runner rather than in a container, why the count is
    # checked before anything is uploaded, and why signing is keyless
    # Sigstore rather than a stored key -- none of that changed, it just does
    # not need saying twice.
    needs: [appimage, deb, rpm, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    # A reusable workflow does not inherit the permissions of the workflow
    # that calls it -- the calling job has to grant them itself, which is why
    # this is not left to the `contents: write` already at the top of this
    # file. Neither grant is new: this job has carried both since keyless
    # signing landed, and the only thing that changed is that the step
    # consuming `id-token: write` now lives in attach-to-release.yml instead of
    # inline here. The genuinely new grant is the same pair on `flatpak.yml`'s
    # own `publish` job, which never signed anything before.
    permissions:
      contents: write
      id-token: write
      # `attach-to-release.yml` dispatches the Discord announcement when it
      # is the job that created the release, and a reusable workflow cannot
      # hold a permission its caller did not grant.
      actions: write
    uses: ./.github/workflows/attach-to-release.yml
    with:
      # cordial-* rather than the four names spelled out: this workflow is
      # the only thing that uploads artifacts under that prefix in a given
      # run, so the glob is exactly the appimage/deb/rpm/arch jobs above and
      # nothing else, however many of them there end up being.
      artifact_pattern: cordial-*
      file_globs: '*.AppImage *.deb *.rpm *.pkg.tar.zst'
      expected_count: 4
