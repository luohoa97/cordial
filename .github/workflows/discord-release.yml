# Announce a published release in the Cordial Discord.
#
# The gap this closes is the one CLAUDE.md already names: "a change that is not
# in a release has not reached anybody", and a release nobody is told about is
# the same failure one step later. The Discord server is linked from the top of
# the README and is where people actually ask for help, so it is where a new
# version should turn up without anyone remembering to paste a link.
#
# This runs `releasify`, which is a third-party action, and the rest of this
# header is what was checked before handing it a webhook.
#
# **It is pinned to a commit, not to `@v1`, and that is not boilerplate here.**
# `tenedev/releasify-action` is archived, has no stars, and was renamed from
# `teneplaysofficial` after its README was written. An archived repository
# cannot receive a fix, but it can still have its tags moved by whoever holds
# the account, and `@v1` and `@v1.0.1` today both resolve to
# bfade1fe75a8a4e8faafbc31c257e44ebfbe8352. Pinning the commit is what makes
# "archived" a stable fact rather than an unmaintained moving target. The
# licence is MIT and its one source file does exactly one thing: POST a Discord
# embed. Nothing else in it reads a secret or the network.
#
# **Following its own README posts an announcement with nothing in it, and that
# is measured rather than suspected.** The action reads the release out of
# `process.env.GITHUB_EVENT`. No such variable exists -- Actions sets
# `GITHUB_EVENT_PATH`, a path to a file -- and the bundled `dist/index.js`
# (sha256 0c1b00d8..., confirmed identical at the pinned commit) never mentions
# `GITHUB_EVENT_PATH` at all. Run against the pinned bundle with its documented
# workflow, the payload it builds is:
#
#     content     : "New Release: `v?.?` in `luohoa97/cordial`"
#     description : "_No release notes provided._"
#     author.name : "unknown"
#     Compare Changes: .../compare/main...v?.?
#
# Every field falls through to a default, including a compare link that 404s.
# Supplying `GITHUB_EVENT` ourselves fixes all of it in the same run -- same
# bundle, same inputs, tag, notes, author, assets and timestamp all correct.
# So the `env:` on the final step is load-bearing; deleting it does not break
# the job, it makes the job succeed at announcing nothing, which is the failure
# mode this repository's own rule about instruments is about.
#
# **That we build the event is also what lets us fit Discord's limits.** An
# embed description is capped at 4096 characters and the whole embed at 6000.
# Cordial's release notes are long on purpose -- they carry a what-is-broken
# section -- and four of the last five were over the cap: v0.12.1 5,376,
# v0.12.0 6,593, v0.11.0 9,657, v0.9.0 5,064. Discord answers an over-length
# embed with a 400 and posts nothing, and the action logs the status code
# without failing the step, so the whole thing would have gone green while the
# server stayed silent. The trim happens in the script below, before the action
# sees anything.
#
# No thumbnail or avatar is set. The only icons this project ships are SVG
# (packaging/icons/hicolor/scalable/), Discord does not render SVG in an embed,
# and a deliberate default beats a broken image.

name: Announce a release on Discord

on:
  # **This trigger does not fire on its own, and that is measured.** GitHub
  # does not start a workflow from an event created by the repository's own
  # `GITHUB_TOKEN`, and the release is created by one: attach-to-release.yml
  # runs `gh release create` with `github.token`. v0.13.0 published at
  # 06:37:43 and nothing here ran; the announcement went out by hand from the
  # dispatch path below.
  #
  # It is kept because a release *published by a person* -- through the web
  # UI, or a `gh release create` run from a laptop -- does fire it, and that
  # is a real path somebody will take. attach-to-release.yml now dispatches
  # this workflow explicitly for the automated path, so the two together cover
  # both without double-posting: only the job that creates the release
  # dispatches, and a release created by hand was never a `GITHUB_TOKEN`
  # event in the first place.
  release:
    types: [published]
  # **A hand-run path, because this project has already lost a release to a
  # workflow that did not fire.** release.yml carries the same escape hatch and
  # says why: a `paths` filter silently matched nothing on a tag and left
  # v0.11.0 tagged twice with no build. An announcement that was missed, or one
  # sent before the notes were finished, should be re-sendable without
  # inventing a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release to announce, e.g. v0.12.1'
        required: true
        type: string

# Read is enough. Nothing here writes to the repository; the only outbound
# write is to Discord, and that authority is the webhook, not the token.
permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    name: Post the release to Discord
    runs-on: ubuntu-latest
    # Long because the job spends nearly all of it asleep -- see "Wait for the
    # packages" below. release.yml's four build jobs each allow 75 minutes and
    # run in parallel with flatpak.yml, so the assets this waits for can be the
    # better part of an hour and a half behind the release being published.
    timeout-minutes: 110
    steps:
      - name: Refuse to run without a webhook, loudly
        # **Failing here rather than skipping is deliberate.** A skipped job is
        # a green tick that says the release was announced when it was not,
        # which is the same lie as the empty embed above with the evidence
        # removed. AGENTS.md: never make a stub lie -- reporting failure keeps
        # the gap where somebody can find it.
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::error::No DISCORD_WEBHOOK secret is set, so this release was not announced." >&2
            echo "Create a webhook on the Discord channel (Edit Channel > Integrations >" >&2
            echo "Webhooks > New Webhook > Copy Webhook URL) and add it to this repository as" >&2
            echo "the DISCORD_WEBHOOK secret. Then re-run this workflow from the Actions tab" >&2
            echo "with the tag as input; nothing needs re-releasing." >&2
            exit 1
          fi

      - name: Check out, for the assembling script below
        uses: actions/checkout@v4
        with:
          # This job reads one Python file and no history. `sparse-checkout`
          # rather than a full clone because a submodule-less shallow checkout
          # of this repository is still tens of megabytes to post a chat
          # message with.
          fetch-depth: 1
          submodules: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Wait for the packages to finish attaching
        # **A release is published before it has anything on it, and announcing
        # at that moment sends people to an empty page.** attach-to-release.yml
        # runs `gh release create` and only then `gh release upload`, so the
        # `release: published` event fires with an assets array of length zero
        # -- and the embed's whole Source Code field would be a ZIP and a TAR of
        # the source. The same is true, for longer, when a human creates the
        # release by hand and lets CI catch up.
        #
        # So poll until the count settles rather than guessing a delay. Settled
        # means non-zero and unchanged across three consecutive reads a minute
        # apart, which distinguishes "all four packages are on" from "the first
        # job to finish has uploaded one". On the hand-run path the assets are
        # years old and it settles on the third read.
        #
        # A timeout announces anyway, with a warning, because a release that
        # went out with one package missing is still worth telling people about
        # -- and silence would be indistinguishable from this workflow being
        # broken.
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + 90 * 60 ))
          prev=-1
          stable=0
          while :; do
            # Written aside and promoted only on success. Redirecting straight
            # into release.json truncates it before gh runs, so one failed read
            # at the deadline would throw away a perfectly good earlier one and
            # leave nothing to announce. A transient API failure is not a
            # reason to abandon the announcement; the loop reads again in a
            # minute.
            if gh api "repos/${REPO}/releases/tags/${TAG}" > release.next 2>/dev/null; then
              mv release.next release.json
              n=$(jq '[.assets[]? | select((.name | endswith(".cosign.bundle")) | not)] | length' release.json)
            else
              echo "could not read the release yet; retrying"
              n=-1
            fi
            if [ "$n" -gt 0 ] && [ "$n" -eq "$prev" ]; then
              stable=$(( stable + 1 ))
            else
              stable=0
            fi
            prev=$n
            if [ "$stable" -ge 2 ]; then
              echo "settled: $n package assets attached"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::gave up waiting after 90 minutes; announcing with $n package assets attached"
              break
            fi
            sleep 60
          done
          test -s release.json

      - name: Fetch the release history, for the compare link
        # The action builds Compare Changes as
        # `compare/{target_commitish}...{tag}`, and target_commitish is the
        # branch the release was cut from -- always "main" here -- so the link
        # read `compare/main...v0.12.1`, which answers "what is in the release
        # that is not on main". That is nothing once the tag is an ancestor of
        # main, and after that it is a list of commits main has *reverted*. The
        # question a reader actually has is what changed since the last
        # release, so the previous tag belongs on the left of the three dots.
        #
        # Only the fetch happens here; picking the previous tag out of the list
        # is the script's job, where it is a tested function rather than a
        # second copy of the same logic in a shell heredoc.
        #
        # Failing soft: with no usable history the script leaves the action's
        # own default alone rather than emitting `compare/...v1.0.0`.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ! gh api "repos/${REPO}/releases?per_page=100" > releases.json 2>/dev/null; then
            echo "::warning::could not list releases; the compare link will use the action's default"
            echo '[]' > releases.json
          fi

      - name: Assemble the release event, trimmed to Discord's limits
        id: event
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/discord-release-event.py release.json releases.json >> "$GITHUB_OUTPUT"

      - name: Work out who to ping, and say so when the answer is nobody
        # **`@updates` typed as text pings nobody**, and that is the whole
        # reason this step exists rather than a literal string in the `with:`
        # block below. Discord only turns a role into a notification when the
        # content carries `<@&ROLE_ID>`; anything else -- including the role's
        # own name with an at sign in front of it -- renders as grey text that
        # looks exactly like a working mention to whoever wrote it and reaches
        # nobody. That is the silent-success shape AGENTS.md rules out for
        # stubs, and it is worse here because the failure is invisible on the
        # only screen anyone checks.
        #
        # So the id lives in a repository variable rather than this file: it is
        # not a secret, a role can be changed without touching the workflow,
        # and a fork announcing to its own server should not inherit ours. The
        # warnings turn both failure modes -- unset, and set to something
        # Discord will not parse -- into something visible in the run summary.
        id: mention
        env:
          RAW: ${{ vars.DISCORD_RELEASE_MENTION }}
        run: |
          set -uo pipefail
          raw="${RAW:-}"
          if [ -z "$raw" ]; then
            echo "::warning::DISCORD_RELEASE_MENTION is not set, so this announcement will not ping anyone. To ping the updates role: turn on Discord's Developer Mode (User Settings > Advanced), right-click the role in Server Settings > Roles and Copy Role ID, then add a repository variable DISCORD_RELEASE_MENTION set to <@&THAT_ID>."
          elif ! printf '%s' "$raw" | grep -qE '^(@here|@everyone|<@&[0-9]+>)$'; then
            echo "::warning::DISCORD_RELEASE_MENTION is '$raw', which Discord renders as plain text and will not ping. A role must be written <@&ROLE_ID>, with the numeric id -- the role's name will not do. If it is already in that form and still does not notify, check the role is mentionable in Server Settings > Roles."
          else
            echo "pinging $raw"
          fi
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Post it
        uses: tenedev/releasify-action@bfade1fe75a8a4e8faafbc31c257e44ebfbe8352 # v1.0.1
        env:
          # See the header. Without this the action announces `v?.?` with no
          # notes, and does it successfully.
          GITHUB_EVENT: ${{ steps.event.outputs.event }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: Cordial
          color: '#5865F2'
          footer: Cordial loads Roblox natively on Linux
          # Checked and warned about in the step above rather than read raw,
          # because the way this goes wrong is silent.
          mention: ${{ steps.mention.outputs.value }}
