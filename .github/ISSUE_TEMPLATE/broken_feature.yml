name: A Roblox feature does not work
description: Something the client does on Android that does nothing, or does the wrong thing, on Cordial
body:
  - type: markdown
    attributes:
      value: |
        Roblox expects Android underneath it. Cordial answers those expectations one at a time, and everything not yet answered is a feature that silently does nothing. Audio is the current example — `slCreateEngine` reports `SL_RESULT_FEATURE_UNSUPPORTED`, honestly and on purpose, so there is no sound.

        This is the project's main body of work, not a defect queue.

  - type: textarea
    id: which-feature
    attributes:
      label: Which feature
      description: What you tried to do, and what happened instead. "Nothing happened" is a perfectly good answer and is the usual one.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Required. Get it from the **Copy** button under **Report a Problem** in the main menu, or from a terminal — `cordial --diagnostics` (.deb/.rpm/Arch), `flatpak run io.github.luohoa97.Cordial --diagnostics` (Flatpak), `./Cordial-*.AppImage --diagnostics` (AppImage), or `cordial-shell --diagnostics` (built from source). It works even when the client cannot start at all — a missing library, a GTK too old, no display — because it is answered before anything else in the process runs, which is exactly the report that most needs it.

        Six rows, looking like this:
        ```
        Cordial   0.11.0 (0fdbb4425)
        Install   rpm
        Roblox    2.736.1408 (fetched by Cordial)
        System    Linux host 7.1.8-200.fc44.x86_64 ... x86_64 GNU/Linux
        Distro    Fedora Linux 44
        Session   wayland (GNOME)
        ```

        It carries your hostname and your distribution's name, and no account name, session token, or profile name. You are about to paste this in public — edit the hostname out first if you would rather it not travel.
      render: text
      placeholder: Paste the output of `cordial --diagnostics` here.
    validations:
      required: true

  - type: textarea
    id: log-archive
    attributes:
      label: Log archive
      description: |
        Required. In Cordial, open the main menu → **Report a Problem** → **Save logs…**, then drag the `.zip` into this box. It holds the diagnostics, the launcher's and client's output, the engine's newest logs, and whether a core dump exists (never the dump itself). Cookies, tickets, link queries, user ids, usernames and typed text are removed before it is written. If Cordial will not start at all, say so here and attach whatever the terminal printed.
      placeholder: Drag cordial-logs.zip here.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### What the engine asked for

        Cordial records what Roblox reached for. Please include whichever of these applies below — a name here is most of the work.

        **A Java class or method nobody implemented.** libjnivm prints these as it goes:

        ```text
        [JNIVM]: Constructed Unresolved symbol, Class=`com/roblox/engine/jni/NativeGLJavaInterface`,
                 StaticMethod=`onLuaTextBoxChangedCallback`, Signature=`(Ljava/lang/String;)V`
        [JNIVM]: Call Unknown Static Function Class=... Method=...
        ```

        `--dump-classes <file>` writes the whole set Roblox asked for. `docs/analysis/observed-java-surface.md` is the running record.

        **A native symbol answered by a stub.** Printed on exit:

        ```text
        === stubs called: N distinct of TOTAL ===
        ```

        TOTAL is however many stubs this build of Cordial compiles in, which grows whenever `docs/analysis/undefined-symbols.tsv` gains an entry — it will not match this example, and that is not a sign anything is wrong.

        **Neither, but it still does nothing.** Say that in the field above. A feature can be broken because a call is answered with a plausible lie rather than not answered at all, and those are the expensive ones.

  - type: textarea
    id: engine-asked-for
    attributes:
      label: What the engine asked for (paste it)
      description: The unresolved-symbol line, the stub-call count, or a note that it was neither.
      render: text
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### What the right answer is

        Three shapes, and picking the wrong one is the main way this goes wrong:

        - **Stub honestly.** The platform genuinely is not there and the engine must be told so. `slCreateEngine` returns failure rather than handing back a dead engine object; `native/opensles.cpp` explains why at length.
        - **Answer with real data.** Cordial knows the truth and just has to say it — the locale, the display metrics, the storage directories.
        - **Translate to the host's equivalent.** Android API in, freedesktop or Linux facility out. Audio is OpenSL ES in and PipeWire out. Notifications are Android's in and the portal's out.

        If you do not know which, pick "Not sure" below and describe the feature above — choosing between them is usually the actual design question.

  - type: dropdown
    id: right-answer
    attributes:
      label: Which shape is the right answer
      options:
        - "Stub honestly — the platform is not there and the engine must be told so"
        - "Answer with real data — Cordial already knows the truth"
        - "Translate to the host's equivalent — an Android API in, a Linux facility out"
        - "Not sure"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Please do not make it lie

        A stub that returns success is worse than one that returns failure. The engine proceeds on an answer that is not true and fails somewhere with no relationship to the cause — `docs/NEXT.md` keeps a list of the times this project chased exactly that. Reporting failure is not giving up; it keeps the gap where someone can find it.

        ### On translations specifically

        A translation is a real design decision and deserves an issue of its own before code. Two things worth stating up front:

        **It changes what Cordial needs from the sandbox.** A host facility means a Flatpak permission, and Cordial's manifest is meant to stay narrow enough that a person can read it and know the whole story ([ADR-007](../../docs/adr/ADR-007-host-resources-are-brokered.md)).

        **Some have no clean equivalent yet, and saying so is a valid outcome.** Passkeys are the honest example: Android routes them through Credential Manager and FIDO2, and the desktop has no settled portal for the same thing. A partial translation that half-works during sign-in is worse than a documented gap.

        ### Reading the binary

        Symbol tables, `DT_NEEDED`, call order, and argument shapes — including method prototypes declared in the dex, which is what `tools/dex_method.py` reads — are all fair game and are how most of this gets solved. Transcribing how Roblox *implements* something is not, and nothing from a decompiler belongs in this repository. See [CONTRIBUTING.md](../../CONTRIBUTING.md).

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      description: Both are welcome. Only the labelling matters.
      options:
        - "Verified — I ran it and this is what it did"
        - "INFERRED — this follows from evidence but I could not test it directly"
    validations:
      required: true
