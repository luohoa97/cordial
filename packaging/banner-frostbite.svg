<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Frostbite — tilted rounded square split by a continuous gap that widens into a square at the centre</title>
  <desc>A rotated square with rounded corners, cut into two halves by a thin bar shaped gap that runs the full width and expands into a rounded square at the centre, filled with a mint to azure to violet gradient. The colours are the exact per-channel inversion of the Cordial mango gradient.</desc>
  <defs>
    <linearGradient id="frostbite5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E494"/>
      <stop offset="45%" stop-color="#0085E7"/>
      <stop offset="100%" stop-color="#4B19FF"/>
    </linearGradient>
    <linearGradient id="sheen5" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="outer5">
      <rect x="190" y="90" width="300" height="300" rx="40" ry="40" transform="rotate(13 340 240)"/>
    </clipPath>
    <mask id="cut5">
      <rect x="140" y="40" width="400" height="400" fill="#fff"/>
      <rect x="150" y="228" width="380" height="24" fill="#000" transform="rotate(13 340 240)"/>
      <rect x="290" y="190" width="100" height="100" rx="18" ry="18" fill="#000" transform="rotate(13 340 240)"/>
    </mask>
  </defs>
  <g clip-path="url(#outer5)" mask="url(#cut5)">
    <rect x="140" y="40" width="400" height="400" fill="url(#frostbite5)"/>
    <rect x="140" y="40" width="400" height="400" fill="url(#sheen5)"/>
  </g>
</svg>
