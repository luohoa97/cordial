<svg width="420" height="420" viewBox="130 30 420 420" xmlns="http://www.w3.org/2000/svg">
  <title>Cordial bot</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1B6B" />
      <stop offset="45%" stop-color="#FF7A18" />
      <stop offset="100%" stop-color="#B4E600" />
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="o">
      <rect x="190" y="90" width="300" height="300" rx="40" ry="40"
        transform="rotate(13 340 240)" />
    </clipPath>
    <mask id="c">
      <rect x="140" y="40" width="400" height="400" fill="#fff" />
      <rect x="150" y="228" width="380" height="24" fill="#000" transform="rotate(13 340 240)" />
      <rect x="290" y="190" width="100" height="100" rx="18" ry="18" fill="#000"
        transform="rotate(13 340 240)" />
    </mask>
  </defs>
  <g clip-path="url(#o)" mask="url(#c)">
    <rect x="140" y="40" width="400" height="400" fill="url(#g)" />
    <rect x="140" y="40" width="400" height="400" fill="url(#s)" />
  </g>
  <!--
    The bot avatar: the application mark with googly eyes stuck on. It has to
    be distinguishable from the app icon at 32px in a member list, or a bot
    message reads as the application talking. The eyes do that while the
    gradient, the tilt, the slot and the centre cut all survive, so it is still
    obviously Cordial, and the centre cut becomes the mouth for free.

    On the 13-degree tilt rather than upright, so they sit on the object
    instead of floating over it, and deliberately mismatched in size with the
    pupils looking different ways. Symmetrical googly eyes are just eyes.
  -->
  <g transform="rotate(13 340 240)">
    <circle cx="297" cy="176" r="43" fill="#fff" stroke="#141414" stroke-width="5" />
    <circle cx="309" cy="191" r="17" fill="#111" />
    <circle cx="386" cy="171" r="38" fill="#fff" stroke="#141414" stroke-width="5" />
    <circle cx="377" cy="185" r="15" fill="#111" />
  </g>
</svg>
