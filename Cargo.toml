[workspace]
resolver = "2"
members = [
    "crates/cordial-linker-sys",
    "crates/cordial-runtime",
    "crates/cordial-plugins",
    "crates/cordial-shell",
    "crates/cordial-update",
]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "GPL-3.0-or-later"  # see LICENSE; third-party notices in THIRD-PARTY-NOTICES.md
rust-version = "1.75"

[profile.release]
debug = true      # the runtime is useless to debug without symbols
