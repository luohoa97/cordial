[package]
name = "cordial-runtime"
description = "Loads and (eventually) runs Roblox's Android x86-64 build on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cordial-run"
path = "src/bin/load.rs"

# Off by default for the same reason `cordial-shell/webview` is: it needs
# `webkitgtk6.0-devel`, which an immutable host does not have. `webview.rs`'s
# JSON parsing and cookie extraction are plain Rust and stay compiled either
# way; only `cordial_shell::webview::{WindowRequest, open}` -- an actual
# `WebKitWebView` -- sits behind this.
[features]
webview = ["cordial-shell/webview"]

[dependencies]
cordial-linker-sys = { path = "../cordial-linker-sys" }
cordial-plugins = { path = "../cordial-plugins" }
# `engine::version_of`, which reads the engine's own version out of
# `libroblox.so`. That scan lived in `load.rs`, where it was a binary's private
# function and therefore unreachable by the updater -- which then had to report
# that it could not tell which build was installed. One copy, in the crate that
# needs to compare it against what Roblox has published. The dependency is new
# only as a direct edge: this crate already pulls `cordial-update` in through
# `cordial-shell`.
cordial-update = { path = "../cordial-update" }
# The window. ADR-011 makes it GTK4/libadwaita and says of the shell's window
# and the engine's host window that they "are the same window"; the engine's
# `wl_surface` is a subsurface of the one `cordial_shell::host_window` builds,
# and a Wayland subsurface must share a connection — and therefore a process —
# with its parent. ADR-002 already accepted core taking a GTK dependency; this
# is where the runtime takes it too.
cordial-shell = { path = "../cordial-shell" }
# Only for `instr_close_window`, which is how the window-close shutdown path is
# driven from a scripted run — see `wayland::instr_close_window`. The window
# itself is `cordial-shell`'s and stays there; this is the one GTK *call* the
# runtime makes, and it needs the trait that carries it. Same version
# cordial-shell pins, because two versions of gtk4-rs in one process would be
# two sets of GObject type registrations for the same C types.
gtk4 = { version = "0.11", features = ["v4_12"] }
# The one `adw::Window` type name this crate needs: `HostWindowCell` wraps
# one inside `android::wayland::WaylandWindow`, and `window()` there hands it
# back so `wire_refresh_rate` can find the output the window is actually on
# and `cordial_runtime::webview`'s presenter can attach an opened web window
# to it. Same version and feature `cordial-shell` pins, for the reason
# `gtk4`'s own comment just above gives: one set of GObject type
# registrations, not two.
libadwaita = { version = "0.9", features = ["v1_5"] }
ureq = "3.3.0"
# The client-settings document is JSON and user flag overrides have to be merged
# into it correctly. A textual splice on a 1.2 MB document is not correctness.
serde_json = "1"
# Assets live in the APK, which is a zip.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The AT-SPI bridge (android::accessibility) speaks org.a11y.atspi.* directly
# over D-Bus — see that module's own doc comment for why a hand-rolled bridge
# was chosen over routing through cordial-shell's GTK/libadwaita widgets.
# Same version cordial-plugins already pins, so this adds an edge to an
# already-resolved dependency rather than a new one to fetch.
zbus = { version = "5.18.0", features = ["blocking"] }
# Roblox's engine detects mimalloc at runtime and logs `[DFLog::Mimalloc]
# Mimalloc integration detected` when it finds it; libroblox.so does not link
# it (zero `mi_` symbols in its own undefined-symbols table), so it must be
# offered as a discoverable library rather than a stub. Sober ships a real
# `libmimalloc.so` beside its binary for the same reason. `extended` pulls in
# `mi_option_get`/`mi_option_set`/`mi_version`, which is the shape the option
# dump in the DFLog line implies the engine queries by.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
