[package]
name = "cordial-plugins"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
minisign-verify = "0.2.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zbus = { version = "5.18.0", features = ["blocking"] }
zstd = "0.13"

[dev-dependencies]
base64 = "0.23.1"
blake2 = "0.10.6"
ed25519-dalek = "3.0.0"
