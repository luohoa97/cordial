[package]
name = "cordial-shell"
description = "Core shell: window, chooser and minimal settings fallback that boots before the UI plugin takes over (ADR-002)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "cordial_shell"
path = "src/lib.rs"

[[bin]]
name = "cordial-shell"
path = "src/main.rs"

# The in-experience web window. Off by default because it needs
# `webkitgtk6.0-devel`, which an immutable host does not have and cannot get
# without layering a package and rebooting -- the same reason `just build
# distrobox` exists. The container has the headers; the host has only the
# runtime library, and a container-built binary runs on the host perfectly well
# because the runtime library is what execution needs.
#
# So: `just build distrobox` gets a client that can open account settings and
# buy Robux, and `just build host` gets one that cannot. That is a worse default
# than it sounds only until somebody tries to build on a stock Silverblue.
[features]
default = []
webview = ["dep:webkit6"]

# Asks a live page what it got, which is the only way to answer "does this
# machine's WebKitGTK do WebAuthn" — see the file. Not built by `cargo test
# --workspace`, which runs without `webview`: an example whose
# `required-features` are absent is skipped rather than failed.
# The frame-scope question webview.rs's TopFrame choice turns on: does a user
# script reach a nested frame, and can that frame see the message handler at
# all. Needs a real WebKitGTK and a display, so it is an example rather than a
# test -- and `required-features` keeps `cargo test --workspace` skipping it
# rather than failing on a missing dependency.
[[example]]
name = "frame_scope_probe"
required-features = ["webview"]

[[example]]
name = "webauthn_probe"
required-features = ["webview"]

[dependencies]
libc = "0.2"
cordial-plugins = { path = "../cordial-plugins" }
# For one symbol pair, and it is worth saying which: `cordial_audio_sinks` /
# `cordial_audio_sinks_free` in `native/pipewire_backend.cpp`, which the Audio
# row in settings uses to list the machine's PipeWire outputs. This crate does
# not call anything in `cordial-linker-sys`'s Rust API -- the edge exists so
# that its build script's `libcordial_liblog.a` reaches this binary's link
# line. See `src/audio_devices.rs`, which explains why the launcher asks the
# client's own enumeration rather than growing a second one, and what the
# coupling costs: building this crate alone now needs the
# `third_party/mcpelauncher-linker` submodule and Clang. A static archive
# contributes nothing for symbols nobody references, so the bionic linker and
# libjnivm are on the link line and not in the launcher.
cordial-linker-sys = { path = "../cordial-linker-sys" }
# The engine cache's stamp (ADR-015). `install.rs` used to test presence alone,
# so a new Roblox build left the old engine in place and Cordial ran it against
# the new APK's assets; `cordial_update::cache` is where that test lives now,
# writing the same stamp string `justfile`'s client recipe writes.
cordial-update = { path = "../cordial-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `v4_12`, and that number is measured rather than chosen. The pin said
# `v4_20` while the comment beside it said 4.10, and the code needed neither:
# lowering it to `v4_10` fails on exactly three call sites, two uses of
# `CssProvider::load_from_string` and one of `ToplevelState::SUSPENDED`, both
# GTK 4.12. `v4_12` builds the workspace clean.
#
# **The eight versions between 4.12 and the old pin are what broke the
# AppImage.** A floor of 4.20 admits only a very new build base, that base was
# Fedora 44, and everything the image bundles came out of it stamped
# GLIBC_2.43 -- so the format whose entire contract is self-containment ran on
# Fedora 44 and nothing older. At 4.12 the base can be Ubuntu 24.04, whose
# glibc 2.39 is exactly the floor `packaging/check-glibc-floor.sh` declares.
# See ADR-032.
gtk4 = { version = "0.11", features = ["v4_12"] }
# Getting `libroblox.so` out of the APK. On a split build it is inside
# `split_config.x86_64.apk` rather than `base.apk`, so the shell has to open a
# zip to set a user up rather than telling them to run `unzip` first. Same
# version and the same minimal feature set `cordial-runtime` already pins, so
# this adds an edge to an already-resolved dependency rather than a new one.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The floor was 1.4 for as long as AdwToolbarView and AdwSwitchRow were the
# newest things used. `AdwDialog` moves it: it landed in 1.5 and it is what a
# Roblox web window should be — attached to the client window, adaptive, and
# closed by the same gesture as every other GNOME sheet, rather than a second
# top-level that lands wherever the compositor decides.
#
# 1.8 rather than the host's 1.9, and the difference is the whole lesson. The
# floor was first set to 1.9 because that is what this developer's host has —
# and that broke `just build distrobox`, which is the *only* environment that
# can build the web view at all, because its fedora-toolbox image carries
# libadwaita 1.8.3 and GTK 4.20.3 against the host's 1.9.1 and 4.22.4.
#
# Nothing is given up. AdwDialog, the reason for moving off 1.4, landed in 1.5.
#
# The rule this leaves behind: the floor is the lowest of every environment
# `just build` supports, not the newest one to hand. The justfile already warns
# that these environments differ and a stale build that still runs is this
# project's most expensive mistake; a floor that only one of them meets is the
# same mistake at configure time.
libadwaita = { version = "0.9", features = ["v1_5"] }
# Optional: see [features] above.
webkit6 = { version = "0.6", optional = true }
# `gdk_wayland_surface_get_wl_surface`/`gdk_wayland_display_get_wl_display`,
# which is all `host_window` wants from it — the raw pointers the runtime's
# hand-marshalled Wayland code needs to parent the engine's surface to this
# window. Deliberately without the `wayland_crate` feature: that would pull in
# a second, typed Wayland binding alongside the one `cordial-runtime` already
# hand-rolls, and the two would then disagree about who owns a proxy.
gdk4-wayland = "0.11"
# For the Marketplace section of the Plugins page: turning the base64 text a
# user pastes in as a trusted index key into a `minisign_verify::PublicKey`
# to hand to `cordial_plugins::marketplace::Trust::Key`. The shell holds this
# because a key is a UI-entered value, not something `cordial-plugins` picks
# a default for — see that crate's `sign` module for why no key ships.
minisign-verify = "0.2.5"
