[package]
name = "cordial-update"
description = "Fetching the official Roblox Android build at the user's request, and never shipping one (ADR-015)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The same client `cordial-runtime::client_settings` already uses for Roblox's
# settings CDN, so this adds an edge to an already-resolved dependency rather
# than a second HTTP stack with a second TLS story.
ureq = "3.3.0"
# A real URL parser, for the allow-list in `url_policy`. Already in the tree as
# ureq's own dependency, so this makes a direct user of a crate that is present
# rather than adding one. String matching is not an option there: the host of
# `https://api.pureapk.com@evil.example/` is `evil.example`.
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streaming, because the thing being hashed is an APK rather than a plugin
# archive. `cordial_plugins::registry::ContentHash` hashes a slice, which would
# mean 115 MB resident before the first check.
sha2 = "0.10"
# Already in the tree via ureq's rustls, so this adds no new dependency to build
# or to package -- it makes a direct user of one that is present. Signature
# verification is the whole of ADR-025's condition for installing a build from a
# source that is not Roblox, and hand-rolling RSA or ECDSA to avoid a line in a
# manifest would be the worst trade available.
ring = "0.17"
# An APK is a zip, and every refusal in ADR-014's list is about zips. Same
# version and the same minimal feature set `cordial-runtime` and
# `cordial-shell` already pin.
zip = { version = "2", default-features = false, features = ["deflate"] }
# `org.freedesktop.NetworkManager`'s `Metered` property, on the system bus.
# Same mechanism as GameMode and the Secret Service, and the same version
# `cordial-plugins` and `cordial-runtime` already pin.
zbus = { version = "5.18.0", features = ["blocking"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
libc = "0.2"

[dev-dependencies]
# Only so one test can pin that the version constant in `deno.rs` and the
# install path in `sandbox` name the same release. Deliberately a
# dev-dependency: `deno::install` takes its directory as a parameter precisely
# so a downloader and a sandbox stay independent at build time.
cordial-plugins = { path = "../cordial-plugins" }
